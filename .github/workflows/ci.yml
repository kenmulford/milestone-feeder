name: CI

# Three pull-request gates for the milestone-feeder plugin. All must pass
# before a PR into main or develop can merge. None of the three builds
# anything: this repo is a Claude Code plugin (markdown skills/agents + JSON
# manifests), so the gates only verify the surface stays clean and loadable.
#
#   1. vocabulary-purge gate:    fails if a retired v0.3.0 word or a stray em
#                                dash (U+2014) reaches the live plugin surface.
#                                Both checked categories, and the allowlist of
#                                sanctioned quotes, are defined in that
#                                script's own header (issue #399).
#   2. plugin-structure check:   fails if a manifest or a skill/agent/command
#                                frontmatter block is malformed, or a governed
#                                prose file (a skills/**/SKILL.md, an
#                                agents/**/*.md, SPEC.md, or a
#                                runtime-referenced docs/*.md) exceeds its
#                                size-budget ceiling (issue #270).
#   3. contract-strings gate:    fails if the implied-surfaces marker or the
#                                anti-fixation prompt drifts from its
#                                canonical hyphen form (gate from issue #369;
#                                hyphen canonical since issue #398).
#
# The three job names below ("vocabulary-purge gate", "plugin-structure check",
# "contract-strings gate") are the required-status-check contexts to wire in
# branch protection.
#
# Runs on pull_request only: required status checks are evaluated on PRs, so a
# push-triggered run would gate nothing and only add noise on the protected
# branch tip. Each branch's protection requires these contexts at merge time.

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vocabulary-purge-gate:
    name: vocabulary-purge gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code under review
        uses: actions/checkout@v7
      - name: Scan the live surface for retired vocabulary and stray em dashes
        run: ./scripts/check-vocabulary.sh

  plugin-structure-check:
    name: plugin-structure check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code under review
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Validate manifests and skill/agent/command frontmatter
        run: python3 scripts/validate-plugin-structure.py

  contract-strings-gate:
    name: contract-strings gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code under review
        uses: actions/checkout@v7
      - name: Scan the live surface for drifted contract strings
        run: ./scripts/check-contract-strings.sh
